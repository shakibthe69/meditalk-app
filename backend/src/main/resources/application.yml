server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: meditalk-backend
  datasource:
    url: jdbc:h2:file:D:/Meditalk/backend/data/meditalk;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  storage:
    upload-dir: d:/Meditalk/backend/uploads
  ocr:
    google-cloud:
      enabled: true
      credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
      api-key: ${GOOGLE_CLOUD_API_KEY:}
    preprocessing:
      max-dimension: 2048
      contrast-enhancement: true
      sharpening: true
      grayscale: true
